<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datagiver Live Board</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f9fafb;
      }
      .card {
        width: min(760px, 92vw);
        background: #1f2937;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }
      p {
        margin: 0 0 12px;
        color: #d1d5db;
        font-size: 0.92rem;
      }
      textarea {
        width: 100%;
        height: 320px;
        resize: vertical;
        border: 1px solid #374151;
        border-radius: 10px;
        background: #111827;
        color: #f9fafb;
        padding: 12px;
        font-size: 1rem;
        line-height: 1.5;
        box-sizing: border-box;
      }
      .meta {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.86rem;
        color: #9ca3af;
      }
      .ok {
        color: #34d399;
      }
      .warn {
        color: #fbbf24;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f3f4f6;
          color: #111827;
        }
        .card {
          background: #ffffff;
          box-shadow: 0 10px 25px rgba(17, 24, 39, 0.12);
        }
        p,
        .meta {
          color: #4b5563;
        }
        textarea {
          background: #ffffff;
          color: #111827;
          border-color: #d1d5db;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Datagiver Live Board</h1>
      <p>Type here. Everyone on this page sees updates instantly.</p>
      <textarea id="editor" placeholder="Write anything..."></textarea>
      <div class="meta">
        <span id="conn" class="warn">Connecting…</span>
        <span id="peers">People online: 0</span>
      </div>
    </main>

    <script type="module">
      import * as Y from 'https://esm.sh/yjs@13.6.18';
      import { WebrtcProvider } from 'https://esm.sh/y-webrtc@10.3.0';
      import { TextareaBinding } from 'https://esm.sh/y-textarea@1.0.1';

      const editor = document.getElementById('editor');
      const conn = document.getElementById('conn');
      const peers = document.getElementById('peers');

      const doc = new Y.Doc();
      const roomKey = location.hash.replace('#', '').trim() || 'public';
      const room = `datagiver-${roomKey}-v1`;
      const provider = new WebrtcProvider(room, doc);
      const yText = doc.getText('shared-content');

      new TextareaBinding(yText, editor);

      const updatePeers = () => {
        peers.textContent = `People online: ${provider.awareness.getStates().size}`;
      };

      provider.on('status', (event) => {
        const connected = event.status === 'connected';
        conn.textContent = connected ? 'Live sync connected' : 'Reconnecting…';
        conn.className = connected ? 'ok' : 'warn';
      });

      provider.awareness.on('change', updatePeers);
      updatePeers();
    </script>
  </body>
</html>
